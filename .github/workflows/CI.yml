name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compiler-fork semantics, deployed-bytecode pins and the expectRevert
  # self-test, in an in-process EVM. Fast, and needs no network after npm ci.
  offline:
    name: Offline checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npm run test:offline

  # Full suite against a local QuantumCoin devnet, installed by
  # scripts/devnet.js from the hash-pinned release archive.
  devnet:
    name: Devnet suite
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Upload devnet node log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-node-log
          path: ~/quantumcoin-devnet/devnet-node.log
          if-no-files-found: ignore
